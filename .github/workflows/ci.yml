name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The build never calls Supabase — these just need to be well-formed so
      # the module can construct a client without throwing. Real e2e needs the
      # real project secrets (see the note on the e2e job below).
      NUXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NUXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      SUPABASE_SERVICE_ROLE_KEY: placeholder
      NUXT_PUBLIC_SITE_URL: https://codepedia.studio
      NUXT_PUBLIC_SITE_URL_RO: https://codepedia.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # e2e/smoke.spec.ts and e2e/cookie-consent.spec.ts hit the real, deployed
  # Supabase project (there's no seeded test fixture or mocked API yet — see
  # the smoke tests' comment on why they resolve a project dynamically rather
  # than hardcoding one). Needs the real project's credentials as repository
  # secrets (Settings -> Secrets and variables -> Actions):
  #   NUXT_PUBLIC_SUPABASE_URL, NUXT_PUBLIC_SUPABASE_ANON_KEY
  # The service-role key is NOT the real one: assertEnv only needs it to be set, no spec
  # needs it (lead and qualifier POSTs are intercepted), and the real key would reach every
  # PR's npm ci (a compromised postinstall could read it and bypass RLS).
  # Secrets are copied into env vars below rather than referenced directly in a step's `if:` — `if: ${{ secrets.X != '' }}` isn't supported the
  # way `if: ${{ env.X != '' }}` is. On a fork, or before these secrets are
  # configured, the env vars are empty and every step here is skipped rather
  # than failing the job. The two secrets are configured (2026-10-13), so the
  # job now runs for real on every PR.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
      NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: e2e-placeholder-not-a-real-key
      NUXT_PUBLIC_SITE_URL: https://codepedia.studio
      NUXT_PUBLIC_SITE_URL_RO: https://codepedia.md
      # Project images are served from R2; the build adds this host to the image domains and the CSP.
      NUXT_PUBLIC_MEDIA_URL: https://media.codepedia.md
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.NUXT_PUBLIC_SUPABASE_URL != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.NUXT_PUBLIC_SUPABASE_URL != '' }}
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: ${{ env.NUXT_PUBLIC_SUPABASE_URL != '' }}

      - run: npx playwright install --with-deps chromium
        if: ${{ env.NUXT_PUBLIC_SUPABASE_URL != '' }}

      - run: npm run test:e2e
        if: ${{ env.NUXT_PUBLIC_SUPABASE_URL != '' }}

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && env.NUXT_PUBLIC_SUPABASE_URL != '' }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
